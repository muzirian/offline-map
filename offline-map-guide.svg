<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" width="595.28" height="841.89">
  <!-- A4 background -->
  <rect width="595.28" height="841.89" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="297.64" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e">Offline Map Setup Guide</text>
  <text x="297.64" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Android — 4 Easy Steps</text>

  <line x1="50" y1="100" x2="545" y2="100" stroke="#ddd" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="40" y="120" width="515" height="150" rx="10" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="70" cy="150" r="14" fill="#4a90d9"/>
  <text x="70" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="95" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">Download an Offline Map App</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="12" fill="#444">Install a map app that supports offline maps, such as:</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="12" fill="#333">• Organic Maps (free, OpenStreetMap-based)</text>
  <text x="60" y="218" font-family="Arial, sans-serif" font-size="12" fill="#333">• Google Maps (select area to download)</text>
  <text x="60" y="236" font-family="Arial, sans-serif" font-size="12" fill="#333">• MAPS.ME (free, offline-first)</text>

  <!-- Step 2 -->
  <rect x="40" y="280" width="515" height="150" rx="10" fill="#e8f8e8" stroke="#4caf50" stroke-width="1.5"/>
  <circle cx="70" cy="310" r="14" fill="#4caf50"/>
  <text x="70" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="95" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">Open the App &amp; Go to Offline Maps</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="12" fill="#444">Open your map app and find the offline maps section:</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="12" fill="#333">• Organic Maps: Menu → Download Maps</text>
  <text x="60" y="378" font-family="Arial, sans-serif" font-size="12" fill="#333">• Google Maps: Profile → Offline Maps → Select Your Own Map</text>
  <text x="60" y="396" font-family="Arial, sans-serif" font-size="12" fill="#333">• MAPS.ME: Menu → Download Maps</text>

  <!-- Step 3 -->
  <rect x="40" y="450" width="515" height="150" rx="10" fill="#fef3e2" stroke="#f5a623" stroke-width="1.5"/>
  <circle cx="70" cy="480" r="14" fill="#f5a623"/>
  <text x="70" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="95" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">Select &amp; Download Your Region</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="12" fill="#444">Choose the area you need:</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333">• Tap the region / country / state you want</text>
  <text x="60" y="548" font-family="Arial, sans-serif" font-size="12" fill="#333">• Adjust the selection rectangle to cover your area</text>
  <text x="60" y="566" font-family="Arial, sans-serif" font-size="12" fill="#333">• Check the download size (use Wi-Fi for large maps)</text>
  <text x="60" y="584" font-family="Arial, sans-serif" font-size="12" fill="#333">• Tap Download (maps are typically 50–500 MB)</text>

  <!-- Step 4 -->
  <rect x="40" y="620" width="515" height="150" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <circle cx="70" cy="650" r="14" fill="#e53935"/>
  <text x="70" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">4</text>
  <text x="95" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">Use Offline — No Internet Needed</text>
  <text x="60" y="680" font-family="Arial, sans-serif" font-size="12" fill="#444">Once downloaded, the map works without any data connection:</text>
  <text x="60" y="700" font-family="Arial, sans-serif" font-size="12" fill="#333">• Search addresses, find routes, and navigate offline</text>
  <text x="60" y="718" font-family="Arial, sans-serif" font-size="12" fill="#333">• GPS still works — your location is shown on the map</text>
  <text x="60" y="736" font-family="Arial, sans-serif" font-size="12" fill="#333">• Update maps periodically when you have Wi-Fi</text>

  <!-- Footer -->
  <line x1="50" y1="790" x2="545" y2="790" stroke="#ddd" stroke-width="1"/>
  <text x="297.64" y="815" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">offlines — offline map setup guide</text>
</svg>
